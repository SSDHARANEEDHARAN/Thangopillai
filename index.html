<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1224" />
    <meta
      name="description"
      content="SkyBlue Birthday — Starlight Edition. A handmade little universe for my Thangopillai."
    />
    <style>
      /* Starlight Midnight is the only theme, so the page starts dark — the
         React app does not get to paint a white flash before it boots. */
      html {
        background-color: #0b1224;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts load without holding up the first paint. The page paints with
         the system font and swaps as soon as Google's copy arrives, which is
         what makes a reload feel instant instead of blank for a moment. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- The entrance photograph, so the first screen has its picture before
         React has finished booting. -->
    <link rel="preload" as="image" fetchpriority="high" href="/photos/p01.jpg" />
    <title>SkyBlue Birthday · Starlight Edition 💙</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
